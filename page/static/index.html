<!doctype html>

<html>
    <head>
        <script src="main.js" defer></script>
        <style>
            body { font-family: system-ui, sans-serif; }
            #donuts { display: flex; flex-wrap: wrap; gap: 32px; }
            .donut { margin: 0; width: 300px; }
            .donut figcaption { font-weight: bold; margin-bottom: 8px; }
            .legend { list-style: none; padding: 0; font-size: 13px; }
            .legend li { display: flex; gap: 6px; align-items: baseline; padding: 2px 0; }
            .legend li.dimmed { opacity: 0.45; }
            .legend .swatch { flex: none; width: 10px; height: 10px; border-radius: 2px; }
            .legend .amount { margin-left: auto; color: #555; white-space: nowrap; }
        </style>
    </head>

    <div>
        <select id="categories"></select>
        <span>-- or --</span>
        <select id="departments"></select>
    </div>

    <div id="container"></div>

    <div>
        <label for="years">Year:</label>
        <select id="years"></select>
    </div>

    <div id="donuts"></div>
</html>

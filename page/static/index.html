<!doctype html>

<html>
    <head>
        <script src="main.js" defer></script>
        <style>
            body { font-family: system-ui, sans-serif; background: #fff; color: #0b0b0b; }
            .year-picker { margin: 24px 0 12px; font-weight: 600; }
            .year-picker select { font: inherit; padding: 4px 8px; margin-left: 6px; }
            #donuts { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; max-width: 1100px; }
            .card { margin: 0; padding: 18px; border: 1px solid #e4e3df; border-radius: 12px; background: #fcfcfb; }
            .card h3 { margin: 0; font-size: 17px; }
            .card figcaption p { margin: 4px 0 12px; font-size: 13px; color: #52514e; }
            .donut { display: block; width: 100%; max-width: 260px; margin: 0 auto; overflow: visible; }
            .donut path { transition: opacity 0.15s; outline: none; }
            .clickable .donut path:focus-visible { stroke: #0b0b0b; }
            .center-value { font-size: 26px; font-weight: 700; fill: #0b0b0b; }
            .center-label { font-size: 12px; fill: #52514e; }
            .legend { list-style: none; padding: 0; margin: 14px 0 0; font-size: 13px; }
            .legend li { display: grid; grid-template-columns: 10px 1fr auto 3.6em; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; }
            .legend li.hovered { background: #f0efec; }
            .legend li.selected { font-weight: 700; background: #f0efec; }
            .clickable .legend li { cursor: pointer; }
            .clickable .donut path { cursor: pointer; }
            .legend .swatch { width: 10px; height: 10px; border-radius: 3px; }
            .legend .amount, .legend .percent { text-align: right; color: #52514e; font-variant-numeric: tabular-nums; }
            .share-bar { display: flex; gap: 2px; height: 28px; margin-top: 8px; }
            .share-segment { min-width: 4px; }
            .share-segment:first-child { border-radius: 6px 0 0 6px; }
            .share-segment:last-child { border-radius: 0 6px 6px 0; }
            .toggle { display: block; margin: 12px 0; font-size: 14px; }
        </style>
    </head>

    <div>
        <select id="categories"></select>
        <span>-- or --</span>
        <select id="departments"></select>
    </div>

    <label class="toggle">
        <input type="checkbox" id="exclude-transfers" checked />
        Don't double-count pension money moved between City funds
    </label>

    <div id="container"></div>

    <div class="year-picker">
        <label for="years">Year:</label>
        <select id="years"></select>
    </div>

    <div id="donuts"></div>
</html>

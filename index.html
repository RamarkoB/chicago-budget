<!doctype html>
<div id="container"></div>

<script type="module">
    import * as d3 from 'https://cdn.jsdelivr.net/npm/d3@7/+esm';

    const response = await fetch('/data/ordinance.csv');
    const textData = await response.text();

    const rows = textData
        .split('\n')
        .slice(1, -1)
        .map((row) => row.split(','));

    const years = [
        ...rows.reduce((acc, row) => {
            acc.add(row[0]);
            return acc;
        }, new Set()),
    ];
    const yearNums = years.map((year) => Number(year));

    const budgets = years.map((year) => {
        const budget = rows
            .filter((row) => row[0] === year)
            .reduce((sum, row) => sum + Number(row.at(-1)), 0);

        return { year, budget };
    });

    // Declare the chart dimensions and margins.
    const width = 640;
    const height = 400;
    const marginTop = 20;
    const marginRight = 20;
    const marginBottom = 30;
    const marginLeft = 40;

    // Declare the x (horizontal position) scale.
    const x = d3
        .scaleLinear()
        .domain(d3.extent(yearNums))
        .range([marginLeft, width - marginRight]);

    // Declare the y (vertical position) scale.
    const y = d3
        .scaleLinear()
        .domain([0, d3.max(budgets, (d) => d.budget)])
        .range([height - marginBottom, marginTop]);

    // Create the SVG container.
    const svg = d3.create('svg').attr('width', width).attr('height', height);

    const line = d3
        .line()
        .x((d) => x(d.year))
        .y((d) => y(d.budget));

    // Add the x-axis.
    svg.append('g')
        .attr('transform', `translate(0,${height - marginBottom})`)
        .call(d3.axisBottom(x).tickFormat(d3.format('d')));

    // Add the y-axis.
    svg.append('g')
        .attr('transform', `translate(${marginLeft},0)`)
        .call(
            d3
                .axisLeft(y)
                .tickFormat((s) => d3.format('.2s')(s).replace('G', 'B')),
        );

    svg.append('path')
        .attr('fill', 'none')
        .attr('stroke', 'steelblue')
        .attr('stroke-width', 1.5)
        .attr('d', line(budgets));

    // Append the SVG element.
    container.append(svg.node());
</script>
